<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" role="img" aria-label="{{name}}">
  <title>{{name}}</title>
  <!-- Generated by scripts/brand.mjs from league/league.json. Do not edit: change the league's
       theme, or put a hand-made replacement in league/brand/, and run `npm run brand`. -->
  <text x="210" y="52" text-anchor="middle" fill="{{brand700}}"
        font-family="'Oswald','Roboto Condensed','Arial Narrow','Helvetica Neue',sans-serif"
        font-weight="600" font-size="{{wordFontSize}}" letter-spacing="2"
        textLength="{{wordLength}}" lengthAdjust="spacingAndGlyphs">{{nameUpper}}</text>

  <rect x="150" y="68" width="120" height="5" rx="2.5" fill="{{trophy}}"/>

  <text x="210" y="90" text-anchor="middle" fill="{{brand500}}"
        font-family="'Oswald','Roboto Condensed','Arial Narrow','Helvetica Neue',sans-serif"
        font-weight="500" font-size="13" letter-spacing="4"
        textLength="{{taglineLength}}" lengthAdjust="spacingAndGlyphs">{{tagline}}</text>
</svg>
