<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="{{name}}, {{taglineLower}}, established {{year}}">
  <title>{{name}}</title>
  <!-- Generated by scripts/brand.mjs from league/league.json. Do not edit: change the league's
       theme, or put a hand-made replacement in league/brand/, and run `npm run brand`. -->
  <defs>
    <path id="arcTop" d="M 24.7 79.8 A 78 78 0 0 1 175.3 79.8"/>
    <path id="arcBottom" d="M 15 122.8 A 88 88 0 0 0 185 122.8"/>
    <g id="star">
      <path d="M0 -6 L1.53 -2.10 L5.71 -1.85 L2.47 0.80 L3.53 4.85 L0 2.6 L-3.53 4.85 L-2.47 0.80 L-5.71 -1.85 L-1.53 -2.10 Z"/>
    </g>
  </defs>
  <circle cx="100" cy="100" r="99" fill="{{ground}}"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="{{trophy}}" stroke-width="3"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="{{trophy}}" stroke-width="2"/>
  <g fill="{{trophy}}"
     font-family="'Oswald','Roboto Condensed','Arial Narrow','Helvetica Neue',sans-serif"
     font-weight="600" font-size="{{ringFontSize}}" letter-spacing="1.5">
    <text><textPath href="#arcTop" startOffset="50%" text-anchor="middle"
                    textLength="{{topLength}}" lengthAdjust="spacingAndGlyphs">{{sealTop}}</textPath></text>
    <text><textPath href="#arcBottom" startOffset="50%" text-anchor="middle"
                    textLength="{{bottomLength}}" lengthAdjust="spacingAndGlyphs">{{sealBottom}}</textPath></text>
  </g>
  <use href="#star" x="17" y="100" fill="{{trophy}}"/>
  <use href="#star" x="183" y="100" fill="{{trophy}}"/>

  <g id="centre">
    <g stroke="{{trophy}}" stroke-width="2" stroke-linecap="round" opacity="0.5">
      <path d="M100 51 V36" transform="rotate(0 100 84)"/>
      <path d="M100 51 V36" transform="rotate(30 100 84)"/>
      <path d="M100 51 V36" transform="rotate(60 100 84)"/>
      <path d="M100 51 V36" transform="rotate(90 100 84)"/>
      <path d="M100 51 V36" transform="rotate(120 100 84)"/>
      <path d="M100 51 V36" transform="rotate(150 100 84)"/>
      <path d="M100 51 V36" transform="rotate(180 100 84)"/>
      <path d="M100 51 V36" transform="rotate(210 100 84)"/>
      <path d="M100 51 V36" transform="rotate(240 100 84)"/>
      <path d="M100 51 V36" transform="rotate(270 100 84)"/>
      <path d="M100 51 V36" transform="rotate(300 100 84)"/>
      <path d="M100 51 V36" transform="rotate(330 100 84)"/>
    </g>
    <g transform="translate(100 84)">
      <circle r="28" fill="{{ground}}" stroke="{{trophy}}" stroke-width="2.5"/>
      <g fill="none" stroke="{{trophy}}" stroke-width="1.6" opacity="0.9">
        <path d="M-26.5 -9 H26.5"/>
        <path d="M-28 0 H28"/>
        <path d="M-26.5 9 H26.5"/>
        <ellipse rx="9.5" ry="28"/>
        <ellipse rx="19" ry="28"/>
      </g>
    </g>
    <g transform="translate(100 126)">
      <ellipse rx="29" ry="17" fill="{{emblem}}" stroke="{{trophy}}" stroke-width="3"/>
      <path d="M-16 0 H16" stroke="{{trophy}}" stroke-width="3" stroke-linecap="round"/>
      <path d="M-10.5 -5.6 V5.6 M-3.5 -6.4 V6.4 M3.5 -6.4 V6.4 M10.5 -5.6 V5.6"
            stroke="{{trophy}}" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <text x="100" y="162" fill="{{trophy}}" text-anchor="middle"
          font-family="'Oswald','Roboto Condensed','Arial Narrow','Helvetica Neue',sans-serif"
          font-weight="600" font-size="15" letter-spacing="2.5">{{year}}</text>
  </g>
</svg>
