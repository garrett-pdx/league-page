<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="The Mudd League, keeper football, established 2021">
  <title>The Mudd League</title>
  <!--
    Primary mark. Use at 96px and up; below that use seal-simple.svg, which drops the ring text
    and the fine centre detail.

    An original mark in the tradition of a college seal. It is NOT a reproduction of the Harvey
    Mudd or Claremont-Mudd-Scripps seal: own ring text, own centre, own year.

    Two constraints shaped the drawing.

    1. An SVG loaded through <img src> gets neither page CSS nor webfonts. So the palette is
       literal hex rather than var(), kept in step with src/theme/_tokens.scss by hand, and the
       ring text can only use fonts already on the machine. The stack mirrors the fontDisplay
       token, and every arc carries textLength with lengthAdjust="spacingAndGlyphs" so the
       lettering spans the same arc whichever fallback actually resolves. Without textLength the
       text overruns or gaps on any machine without Oswald.
    2. The centre is deliberately geometric: circles, ellipses, arcs and straight lines. There
       is no SVG rasterizer on this machine, so nothing here can be drawn by eye against a
       render; organic silhouette work would be guesswork. A stag can be dropped into the
       #centre group later without touching anything else.

    Note for editors: an XML comment may not contain two consecutive hyphens. That includes
    writing CSS custom property names in full. It is a parse error, not a warning, and it blanks
    the entire file.

    Text baselines sit on their own radii, not a shared one: glyphs grow away from the path, so
    the top arc runs at r=78 (growing outward toward the r=92 ring) and the bottom arc at r=88
    (growing inward). Sharing a radius would push one of them through a ring.
  -->
  <defs>
    <path id="arcTop" d="M 24.7 79.8 A 78 78 0 0 1 175.3 79.8"/>
    <path id="arcBottom" d="M 15 122.8 A 88 88 0 0 0 185 122.8"/>
    <g id="star">
      <path d="M0 -6 L1.53 -2.10 L5.71 -1.85 L2.47 0.80 L3.53 4.85 L0 2.6 L-3.53 4.85 L-2.47 0.80 L-5.71 -1.85 L-1.53 -2.10 Z"/>
    </g>
  </defs>

  <!-- ground and rings -->
  <circle cx="100" cy="100" r="99" fill="#000000"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#EAAA00" stroke-width="3"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#EAAA00" stroke-width="2"/>

  <!-- ring text -->
  <g fill="#EAAA00"
     font-family="'Oswald','Roboto Condensed','Arial Narrow','Helvetica Neue',sans-serif"
     font-weight="600" font-size="16" letter-spacing="1.5">
    <text><textPath href="#arcTop" startOffset="50%" text-anchor="middle"
                    textLength="188" lengthAdjust="spacingAndGlyphs">THE MUDD LEAGUE</textPath></text>
    <text><textPath href="#arcBottom" startOffset="50%" text-anchor="middle"
                    textLength="212" lengthAdjust="spacingAndGlyphs">KEEPER FOOTBALL</textPath></text>
  </g>

  <!-- side stars, sitting in the text band at r=83 -->
  <use href="#star" x="17" y="100" fill="#EAAA00"/>
  <use href="#star" x="183" y="100" fill="#EAAA00"/>

  <g id="centre">
    <!-- sunburst behind the globe: 12 rays at 30 degree steps, r 33 to 48 -->
    <g stroke="#EAAA00" stroke-width="2" stroke-linecap="round" opacity="0.5">
      <path d="M100 51 V36" transform="rotate(0 100 84)"/>
      <path d="M100 51 V36" transform="rotate(30 100 84)"/>
      <path d="M100 51 V36" transform="rotate(60 100 84)"/>
      <path d="M100 51 V36" transform="rotate(90 100 84)"/>
      <path d="M100 51 V36" transform="rotate(120 100 84)"/>
      <path d="M100 51 V36" transform="rotate(150 100 84)"/>
      <path d="M100 51 V36" transform="rotate(180 100 84)"/>
      <path d="M100 51 V36" transform="rotate(210 100 84)"/>
      <path d="M100 51 V36" transform="rotate(240 100 84)"/>
      <path d="M100 51 V36" transform="rotate(270 100 84)"/>
      <path d="M100 51 V36" transform="rotate(300 100 84)"/>
      <path d="M100 51 V36" transform="rotate(330 100 84)"/>
    </g>

    <!-- globe: circle, three latitude chords, three longitude ellipses -->
    <g transform="translate(100 84)">
      <circle r="28" fill="#000000" stroke="#EAAA00" stroke-width="2.5"/>
      <g fill="none" stroke="#EAAA00" stroke-width="1.6" opacity="0.9">
        <path d="M-26.5 -9 H26.5"/>
        <path d="M-28 0 H28"/>
        <path d="M-26.5 9 H26.5"/>
        <ellipse rx="9.5" ry="28"/>
        <ellipse rx="19" ry="28"/>
      </g>
    </g>

    <!-- Football. Sits 4 units higher than the globe's lower edge so it reads as being in
         front of it, and high enough to leave the year clear air below. -->
    <g transform="translate(100 126)">
      <ellipse rx="29" ry="17" fill="#862633" stroke="#EAAA00" stroke-width="3"/>
      <path d="M-16 0 H16" stroke="#EAAA00" stroke-width="3" stroke-linecap="round"/>
      <path d="M-10.5 -5.6 V5.6 M-3.5 -6.4 V6.4 M3.5 -6.4 V6.4 M10.5 -5.6 V5.6"
            stroke="#EAAA00" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- founding year: the league began on ESPN in 2021, a season before it moved to Sleeper -->
    <text x="100" y="162" fill="#EAAA00" text-anchor="middle"
          font-family="'Oswald','Roboto Condensed','Arial Narrow','Helvetica Neue',sans-serif"
          font-weight="600" font-size="15" letter-spacing="2.5">2021</text>
  </g>
</svg>
