<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="not set">
  <!--
    Placeholder for a manager attribute that hasn't been filled in.
    Transparent background so it reads in both themes. #767676 is the one mid grey
    that clears WCAG AA against BOTH backgrounds this sits on: 4.54:1 on #fff
    (light) and 4.62:1 on #000 (dark). Do not layer opacity on top of it;
    compositing drops it to roughly 1.8:1 and it vanishes.
    Note: no double hyphen inside this comment, it is illegal in XML and silently
    breaks the whole file.
  -->
  <text x="20" y="29" text-anchor="middle"
        font-family="Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="600" fill="#767676">?</text>
</svg>
