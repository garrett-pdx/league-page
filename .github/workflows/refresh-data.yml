# Keeps the league's history dataset current: pulls from Sleeper, rebuilds the derived files,
# and commits the result, twice a week in season (Tuesday and Friday mornings, US time).
#
# OFF until you opt in: set the repository variable REFRESH_DATA to "true"
# (Settings > Secrets and variables > Actions > Variables). It can also be run by hand from the
# Actions tab. The deploy (Vercel) picks up the commit like any other push.
#
# If the pipeline's self-checks fail, nothing is committed and the run fails, so a broken pull
# never reaches the site; the log says what to fix.
name: Refresh league data

on:
  schedule:
    - cron: "0 14 * * 2"   # Tuesday 14:00 UTC, after Monday night's games are final
    - cron: "0 14 * * 5"   # Friday 14:00 UTC, after Thursday night and waivers
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.REFRESH_DATA == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull from Sleeper
        run: python3 scripts/pull-league-history.py
      - name: Derive the site's data
        run: python3 scripts/derive-site-data.py
      - name: Derive the lore
        run: python3 scripts/derive-narratives.py
      - name: Commit if anything changed
        run: |
          git config user.name "league-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data docs/league-lore.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh league data from Sleeper"
            git push
          fi
