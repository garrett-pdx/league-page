<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="apple-mobile-web-app-capable" content="yes">

		<!-- favicons -->
		<!-- SVG first: browsers that understand it (Chrome, Firefox, Edge, Safari 16+) use the
		     current mark, and older ones ignore the unknown type and fall back to the PNG/ICO
		     below. Those raster files are still the old blue shield and cannot be regenerated
		     without adding a rasterizer to the toolchain, so this link is what keeps the browser
		     tab in step with the nav for essentially everyone. -->
		<link rel="icon" type="image/svg+xml" href="/brand/seal-simple.svg">
		<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
		<link rel="mask-icon" href="/favicons/safari-pinned-tab.svg" color="#00316b">
		<link rel="shortcut icon" href="/favicons/favicon.ico">
		<meta name="apple-mobile-web-app-title" content="The Mudd League">
		<meta name="application-name" content="The Mudd League">
		<meta name="msapplication-TileColor" content="#00316b">
		<meta name="msapplication-config" content="/favicons/browserconfig.xml">
		<meta name="theme-color" content="#ffffff">

		<!-- PWA -->
		<link rel="manifest" href="/manifest.json">
		<link rel="apple-touch-startup-image" href="pwa/apple-splash-2048-2732.jpg" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

		<!-- Fonts and CSS -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<!-- crossorigin is required on the gstatic preconnect: font files are CORS fetches, and
		     without it the browser opens a second connection and the hint is wasted. -->
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- Material Icons stays on the legacy icon?family= endpoint and stays its own request.
		     That endpoint is what defines the .material-icons CLASS rule (font-family + ligature
		     settings) that Nav, Pagination, Roster and TransactionsPage all depend on. Folding it
		     into the css2 request below would drop that rule and blank every icon. -->
		<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" />

		<!-- SMUI Styles -->
		<!-- Light-only. The media="(prefers-color-scheme: light)" attribute MUST stay off this
		     link: with it, a visitor whose OS is in dark mode gets no MDC CSS at all. Note that
		     static/smui-dark.css is still built by `npm run prepare`, it is just never served. -->
		<link rel="stylesheet" href="/smui.css" />
		%sveltekit.head%
	</head>
	<body>
		<div id="svelte">%sveltekit.body%</div>
	</body>
</html>
